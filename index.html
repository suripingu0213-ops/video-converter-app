<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5856d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="動画変換">
<title>動画変換</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f2f2f6; --card: #ffffff; --text: #1c1c1e; --sub: #6b6b73; --line: #e2e2e8;
  --accent: #5856d6; --accent-weak: #e9e8fb; --ok: #1f8a4c; --warn: #b26a00; --bad: #c62828;
  --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1c1c1e; --text: #f2f2f7; --sub: #9a9aa2; --line: #2c2c30;
    --accent: #8583ff; --accent-weak: #25244a; --ok: #42c278; --warn: #f0a640; --bad: #ff6b6b;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
header { position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 8px; display: flex; align-items: baseline; gap: 8px; }
header h1 { margin: 0; font-size: 22px; }
header .ver { color: var(--sub); font-size: 12px; }
header .spacer { flex: 1; }
main { padding: 0 16px 16px; max-width: 640px; margin: 0 auto; }
section[hidden] { display: none; }
.card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.muted { color: var(--sub); font-size: 13px; }
.notice { background: var(--accent-weak); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
label.field { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 4px; }
textarea, input[type=text], input[type=password] { width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); font-family: inherit; }
textarea { min-height: 88px; resize: vertical; }
button { font: inherit; font-size: 15px; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
  background: var(--line); color: var(--text); }
button.primary { background: var(--accent); color: #fff; font-weight: 600; }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; }
button.full { width: 100%; padding: 13px; font-size: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; background: transparent; padding: 8px 4px; font-size: 14px; }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: 600; }
/* ライブラリ */
.item { display: flex; gap: 12px; align-items: center; }
.thumb { width: 104px; height: 58px; border-radius: 8px; background: var(--line) center/cover no-repeat; flex: none; position: relative; }
.thumb .dur { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.7); color: #fff; font-size: 11px; padding: 1px 4px; border-radius: 4px; }
.info { flex: 1; min-width: 0; }
.title { font-size: 15px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.badges { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.badge { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--bg); color: var(--sub); }
.badge.saved { background: var(--ok); color: #fff; }
.actions { display: flex; gap: 8px; margin-top: 10px; }
.actions button { flex: 1; padding: 9px 6px; font-size: 14px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
/* 変換履歴 */
.run { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.run:first-child { border-top: 0; }
.run .st { font-size: 12px; font-weight: 700; white-space: nowrap; padding: 3px 8px; border-radius: 6px; background: var(--bg); }
.st.ok { color: var(--ok); } .st.bad { color: var(--bad); } .st.wait { color: var(--warn); }
.run .u { font-size: 13px; word-break: break-all; }
/* タブ */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; background: transparent; border-radius: 0; padding: 8px 0 10px; font-size: 11px; color: var(--sub);
  display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav button svg { width: 24px; height: 24px; }
nav button.on { color: var(--accent); }
/* プレイヤー・シート */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.92); display: flex; flex-direction: column; }
.overlay[hidden] { display: none; }
.player-top { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; color: #fff; }
.player-top .t { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-top button { background: rgba(255,255,255,.15); color: #fff; padding: 8px 12px; }
.player-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; gap: 16px; min-height: 0; }
.player-body video { width: 100%; max-height: 100%; background: #000; }
.player-body img { width: min(80vw, 360px); border-radius: 12px; }
.player-body audio { width: min(92vw, 480px); }
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; }
.sheet-bg[hidden] { display: none; }
.sheet { background: var(--card); width: 100%; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet h3 { margin: 0 0 4px; font-size: 16px; }
.sheet p { margin: 0 0 12px; }
.sheet button { width: 100%; margin-top: 8px; padding: 13px; font-size: 16px; }
.empty { text-align: center; color: var(--sub); padding: 40px 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 40;
  background: rgba(30,30,30,.92); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; max-width: 90vw; }
.toast[hidden] { display: none; }
ol.steps { padding-left: 20px; margin: 6px 0; font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <h1 id="h-title">ライブラリ</h1><span class="ver" id="ver"></span>
  <span class="spacer"></span>
  <button id="btn-refresh" aria-label="更新">更新</button>
</header>

<main>
  <!-- ライブラリ -->
  <section id="tab-library">
    <div id="lib-notice" class="notice" hidden></div>
    <div id="lib-list"></div>
  </section>

  <!-- 変換 -->
  <section id="tab-convert" hidden>
    <div class="card">
      <label class="field" for="url">URL（YouTube・ニコニコ動画。複数は改行で）</label>
      <textarea id="url" placeholder="https://www.youtube.com/watch?v=..." autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px"><button id="btn-paste">貼り付け</button><button id="btn-clear">クリア</button></div>
      <label class="field">形式</label>
      <div class="seg" id="seg-format">
        <button data-v="mp4" class="on">動画 MP4</button><button data-v="m4a">音声 M4A</button><button data-v="mp3">音声 MP3</button>
      </div>
      <div id="quality-wrap">
        <label class="field">画質</label>
        <div class="seg" id="seg-quality">
          <button data-v="360">360p</button><button data-v="480">480p</button><button data-v="720" class="on">720p</button><button data-v="1080">1080p</button><button data-v="best">最高</button>
        </div>
      </div>
      <p class="muted" id="fmt-hint"></p>
      <button class="primary full" id="btn-convert">変換する</button>
    </div>
    <div class="card">
      <div class="row"><strong style="flex:1">変換の状況</strong><span class="muted" id="runs-updated"></span></div>
      <div id="runs"></div>
    </div>
  </section>

  <!-- 設定 -->
  <section id="tab-settings" hidden>
    <div class="card">
      <strong>GitHub の接続</strong>
      <label class="field" for="token">トークン（この端末の中だけに保存されます）</label>
      <input type="password" id="token" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_...">
      <label class="field" for="repo">リポジトリ</label>
      <input type="text" id="repo" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="row" style="margin-top:10px"><button class="primary" id="btn-save-settings">保存して接続確認</button></div>
      <p class="muted" id="conn-status"></p>
    </div>
    <div class="card">
      <strong>容量</strong>
      <p class="muted" id="usage">計算中…</p>
      <button class="danger" id="btn-wipe">この端末に保存した動画をすべて削除</button>
    </div>
    <div class="card">
      <strong>使い方</strong>
      <ol class="steps">
        <li>「変換」で URL を貼り付けて「変換する」</li>
        <li>完了したら「ライブラリ」で「保存」（Wi‑Fi のときがおすすめ）</li>
        <li>保存した動画は電波がなくても再生できます</li>
      </ol>
      <p class="muted">YouTube は自宅 PC で変換します。PC の電源が切れている間に頼んだ分は、PC を付けたときに処理されます（最大24時間待機）。ニコニコ動画は PC がなくても変換できます。</p>
      <p class="muted">保存中は画面を開いたままにしてください（画面を閉じると止まります。開き直せば続きから再開します）。</p>
    </div>
  </section>
</main>

<nav>
  <button data-tab="library" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M10 8.5v5l4-2.5z" fill="currentColor"/><path d="M7 21h10"/></svg>ライブラリ</button>
  <button data-tab="convert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>変換</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
</nav>

<div class="overlay" id="player" hidden>
  <div class="player-top">
    <button id="btn-close-player">閉じる</button>
    <span class="t" id="player-title"></span>
    <button id="btn-share">共有</button>
  </div>
  <div class="player-body" id="player-body"></div>
</div>

<div class="sheet-bg" id="sheet" hidden><div class="sheet" id="sheet-inner"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
